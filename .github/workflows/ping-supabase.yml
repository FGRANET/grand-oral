name: Ping Supabase (anti-pause)

on:
  schedule:
    # Tous les lundis à 6h00 UTC (7h00 heure de Paris en hiver, 8h00 en été)
    - cron: '0 6 * * 1'
  workflow_dispatch:    # permet aussi de le lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
